model:
  model_dir: /models
  model_name: glm53-flash-exl3-2.05bpw-turboderp
  backend: exllamav3
  max_seq_len: 49152
  cache_size: 65536
  cache_mode: 8,8
  max_batch_size: 4
  tensor_parallel: false
  gpu_split: [31.0, 31.0]
  gpu_split_auto: false
  cpu_moe_offload_layers: 0
  cpu_moe_split_experts: 104
  chunk_size: 512
  output_chunking: true
  vision: true
  vision_offload: false
  reasoning: true
  reasoning_start_token: <think>
  reasoning_end_token: </think>
  start_in_reasoning: auto
draft_model:
  draft_mode: mtp
  draft_num_tokens: 1
  draft_cache_mode: Q8
  dynamic_draft: false
memory:
  sysmem_recurrent_cache: 0
  sysmem_kv_cache: 0

