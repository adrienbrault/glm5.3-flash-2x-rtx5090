<svg xmlns="http://www.w3.org/2000/svg" width="640" height="350" viewBox="0 0 640 350" role="img" aria-labelledby="t d">
<title id="t">Decode rate by number of concurrent streams</title>
<desc id="d">Per-stream decode 59.9, 41.1, 27.5 tok/s and sum of the streams 59.9, 82.2, 109.9 tok/s at 1, 2, 4 streams.</desc>
<style>
  .bg { fill: #fcfcfb; }
  .t1 { fill: #0b0b0b; font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .t2 { fill: #52514e; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .t3 { fill: #0b0b0b; font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .grid { stroke: #e6e5e0; stroke-width: 1; }
  .axis { stroke: #bdbcb5; stroke-width: 1; }
  .s1 { fill: #2a78d6; } .s1l { stroke: #2a78d6; }
  .s2 { fill: #eb6834; } .s2l { stroke: #eb6834; }
  .ring { stroke: #fcfcfb; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .t1, .t3 { fill: #ffffff; } .t2 { fill: #c3c2b7; }
    .grid { stroke: #2e2e2c; } .axis { stroke: #55544f; }
    .s1 { fill: #3987e5; } .s1l { stroke: #3987e5; }
    .s2 { fill: #d95926; } .s2l { stroke: #d95926; }
    .ring { stroke: #1a1a19; }
  }
</style>
<rect class="bg" width="640" height="350" rx="8"/>
<text class="t1" x="20" y="30">Decode rate by number of concurrent streams</text>
<text class="t2" x="20" y="50">tok/s, chat requests forced to 1,024 tokens, temperature 0, median of 3 rounds (R882b)</text>
<line class="grid" x1="56" x2="570" y1="304.0" y2="304.0"/>
<text class="t2" x="48" y="308.0" text-anchor="end">0</text>
<line class="grid" x1="56" x2="570" y1="269.3" y2="269.3"/>
<text class="t2" x="48" y="273.3" text-anchor="end">20</text>
<line class="grid" x1="56" x2="570" y1="234.7" y2="234.7"/>
<text class="t2" x="48" y="238.7" text-anchor="end">40</text>
<line class="grid" x1="56" x2="570" y1="200.0" y2="200.0"/>
<text class="t2" x="48" y="204.0" text-anchor="end">60</text>
<line class="grid" x1="56" x2="570" y1="165.3" y2="165.3"/>
<text class="t2" x="48" y="169.3" text-anchor="end">80</text>
<line class="grid" x1="56" x2="570" y1="130.7" y2="130.7"/>
<text class="t2" x="48" y="134.7" text-anchor="end">100</text>
<line class="grid" x1="56" x2="570" y1="96.0" y2="96.0"/>
<text class="t2" x="48" y="100.0" text-anchor="end">120</text>
<text class="t2" x="56.0" y="324" text-anchor="middle">1 stream</text>
<text class="t2" x="313.0" y="324" text-anchor="middle">2 streams</text>
<text class="t2" x="570.0" y="324" text-anchor="middle">4 streams</text>
<polyline class="s2l" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="56.0,200.2 313.0,161.5 570.0,113.5"/>
<circle class="s2 ring" cx="56.0" cy="200.2" r="5"><title>1 stream, sum of the streams: 59.9 tok/s</title></circle>
<circle class="s2 ring" cx="313.0" cy="161.5" r="5"><title>2 streams, sum of the streams: 82.2 tok/s</title></circle>
<circle class="s2 ring" cx="570.0" cy="113.5" r="5"><title>4 streams, sum of the streams: 109.9 tok/s</title></circle>
<text class="t3" x="582.0" y="117.5">109.9</text>
<polyline class="s1l" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="56.0,200.2 313.0,232.7 570.0,256.4"/>
<circle class="s1 ring" cx="56.0" cy="200.2" r="5"><title>1 stream, per stream: 59.9 tok/s</title></circle>
<circle class="s1 ring" cx="313.0" cy="232.7" r="5"><title>2 streams, per stream: 41.1 tok/s</title></circle>
<circle class="s1 ring" cx="570.0" cy="256.4" r="5"><title>4 streams, per stream: 27.5 tok/s</title></circle>
<text class="t3" x="582.0" y="260.4">27.5</text>
<text class="t3" x="56.0" y="188.2" text-anchor="middle">59.9</text>
<text class="t3" x="313.0" y="149.5" text-anchor="middle">82.2</text>
<text class="t3" x="313.0" y="254.7" text-anchor="middle">41.1</text>
<line class="axis" x1="56" x2="570" y1="304.0" y2="304.0"/>
<circle class="s1" cx="26" cy="72" r="5"/><text class="t2" x="36" y="76">per stream</text>
<circle class="s2" cx="126" cy="72" r="5"/><text class="t2" x="136" y="76">sum of the streams</text>
</svg>
