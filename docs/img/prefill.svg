<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="t d">
<title id="t">Cold prefill rate by prompt length</title>
<desc id="d">8,156 prompt tokens: 1,999 tok/s; 32,811 prompt tokens: 2,146 tok/s.</desc>
<style>
  .bg { fill: #fcfcfb; }
  .t1 { fill: #0b0b0b; font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .t2 { fill: #52514e; font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .t3 { fill: #0b0b0b; font: 600 12px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .grid { stroke: #e6e5e0; stroke-width: 1; }
  .axis { stroke: #bdbcb5; stroke-width: 1; }
  .s1 { fill: #2a78d6; } .s1l { stroke: #2a78d6; }
  .s2 { fill: #eb6834; } .s2l { stroke: #eb6834; }
  .ring { stroke: #fcfcfb; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .t1, .t3 { fill: #ffffff; } .t2 { fill: #c3c2b7; }
    .grid { stroke: #2e2e2c; } .axis { stroke: #55544f; }
    .s1 { fill: #3987e5; } .s1l { stroke: #3987e5; }
    .s2 { fill: #d95926; } .s2l { stroke: #d95926; }
    .ring { stroke: #1a1a19; }
  }
</style>
<rect class="bg" width="640" height="330" rx="8"/>
<text class="t1" x="20" y="30">Cold prefill rate by prompt length</text>
<text class="t2" x="20" y="50">tok/s, engine-timed, no cached tokens (R882b); the axis spans the 262,144-token window</text>
<line class="grid" x1="64" x2="600" y1="280.0" y2="280.0"/>
<text class="t2" x="56" y="284.0" text-anchor="end">0</text>
<line class="grid" x1="64" x2="600" y1="240.0" y2="240.0"/>
<text class="t2" x="56" y="244.0" text-anchor="end">500</text>
<line class="grid" x1="64" x2="600" y1="200.0" y2="200.0"/>
<text class="t2" x="56" y="204.0" text-anchor="end">1,000</text>
<line class="grid" x1="64" x2="600" y1="160.0" y2="160.0"/>
<text class="t2" x="56" y="164.0" text-anchor="end">1,500</text>
<line class="grid" x1="64" x2="600" y1="120.0" y2="120.0"/>
<text class="t2" x="56" y="124.0" text-anchor="end">2,000</text>
<line class="grid" x1="64" x2="600" y1="80.0" y2="80.0"/>
<text class="t2" x="56" y="84.0" text-anchor="end">2,500</text>
<text class="t2" x="64.0" y="300" text-anchor="middle">0</text>
<text class="t2" x="198.0" y="300" text-anchor="middle">64k</text>
<text class="t2" x="332.0" y="300" text-anchor="middle">128k</text>
<text class="t2" x="466.0" y="300" text-anchor="middle">192k</text>
<text class="t2" x="600.0" y="300" text-anchor="middle">256k</text>
<text class="t2" x="332.0" y="322" text-anchor="middle">prompt tokens</text>
<polyline class="s1l" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="80.7,120.1 131.1,108.3"/>
<circle class="s1 ring" cx="80.7" cy="120.1" r="5"><title>8,156 prompt tokens: 1,999 tok/s</title></circle>
<text class="t3" x="80.7" y="144.1" text-anchor="middle">1,999</text>
<circle class="s1 ring" cx="131.1" cy="108.3" r="5"><title>32,811 prompt tokens: 2,146 tok/s</title></circle>
<text class="t3" x="131.1" y="132.3" text-anchor="middle">2,146</text>
<line class="axis" x1="64" x2="600" y1="280.0" y2="280.0"/>
</svg>
